name: Publish to npm

# Triggers when a new release is published on GitHub
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-22.23.4-pnpm-10.34.5-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:run

      - name: Build package
        run: pnpm run build

      - name: Pack package
        run: pnpm pack --pack-destination package-artifact

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: package-artifact/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for npm provenance

    steps:
      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package-artifact

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish ./package-artifact/*.tgz --access=public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
